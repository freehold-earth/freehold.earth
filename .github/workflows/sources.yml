name: Status sources

# The site's status claims cite files in freehold-earth/freehold. This fails
# (and emails the repo owners) when one of them is renamed or deleted.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-sources.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
